<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PvP Knights | Power Rankings</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1 id="origin-title">PVP KNIGHTS</h1>
        <div class="title-underline"></div>
        <div class="subtitle">Official Rankings</div>
    </header>

    <nav id="rank-tabs">
        <div class="nav-left">
            <button id="home-btn" class="tab-btn active" onclick="showHome()">Home</button>
            <button id="info-btn" class="tab-btn" onclick="showRatings()">Ratings Explained</button>
        </div>

        <div class="nav-center">
            <button class="tab-btn" onclick="showRank('S')">S</button>
            <button class="tab-btn" onclick="showRank('A')">A</button>
            <button class="tab-btn" onclick="showRank('B')">B</button>
            <button class="tab-btn" onclick="showRank('C')">C</button>
            <button class="tab-btn" onclick="showRank('D')">D</button>
            <button class="tab-btn" onclick="showRank('E')">Unrated</button>
        </div>

        <div class="nav-right">
            <input type="text" id="playerSearch" placeholder="Search Knight..." oninput="handleSearch()">
        </div>
    </nav>

    <div id="container"></div>

    <script src="script.js"></script>
</body>
</html>
