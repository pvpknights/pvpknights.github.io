<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PvP Knights | Power Rankings</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1 id="origin-title">PVP KNIGHTS</h1>
        <div class="title-underline"></div>
        <div class="subtitle">Official Power Rankings</div>
    </header>

    <nav id="rank-tabs">
        <button id="home-btn" class="tab-btn active" onclick="showHome()">Home</button>
        <button class="tab-btn" onclick="showRank('S')">S Tier</button>
        <button class="tab-btn" onclick="showRank('A')">A Tier</button>
        <button class="tab-btn" onclick="showRank('B')">B Tier</button>
        <button class="tab-btn" onclick="showRank('C')">C Tier</button>
        <button class="tab-btn" onclick="showRank('D')">D Tier</button>
        <button class="tab-btn" onclick="showRank('E')">E Tier</button>
    </nav>

    <div id="container"></div>

    <script src="script.js"></script>
</body>
</html>
